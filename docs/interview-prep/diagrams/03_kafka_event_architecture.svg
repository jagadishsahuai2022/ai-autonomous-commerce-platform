<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)" rx="12"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Kafka Event-Driven Architecture — Topic &amp; Consumer Map</text>

  <!-- PRODUCERS (Left) -->
  <text x="100" y="80" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">PRODUCERS</text>

  <rect x="20" y="100" width="160" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">NestJS API</text>
  <text x="100" y="140" text-anchor="middle" fill="#bfdbfe" font-size="9">Orders, Cart, User Actions</text>

  <rect x="20" y="165" width="160" height="50" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="187" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Next.js Web</text>
  <text x="100" y="205" text-anchor="middle" fill="#bfdbfe" font-size="9">Views, Clicks, Searches</text>

  <rect x="20" y="230" width="160" height="50" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="252" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Intent Parser</text>
  <text x="100" y="270" text-anchor="middle" fill="#ddd6fe" font-size="9">Parsed Intents</text>

  <rect x="20" y="295" width="160" height="50" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="317" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Aggregator</text>
  <text x="100" y="335" text-anchor="middle" fill="#ddd6fe" font-size="9">Fetched Products</text>

  <rect x="20" y="360" width="160" height="50" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="382" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Ranking Engine</text>
  <text x="100" y="400" text-anchor="middle" fill="#ddd6fe" font-size="9">Ranked Products</text>

  <rect x="20" y="425" width="160" height="50" rx="8" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="447" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">Autopilot Engine</text>
  <text x="100" y="465" text-anchor="middle" fill="#a7f3d0" font-size="9">Execution Results</text>

  <rect x="20" y="490" width="160" height="50" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="100" y="512" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">AI Service</text>
  <text x="100" y="530" text-anchor="middle" fill="#ddd6fe" font-size="9">Recommendations, ML</text>

  <!-- KAFKA TOPICS (Center) -->
  <text x="600" y="80" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="bold">KAFKA TOPICS (Apache Kafka 7.5)</text>

  <rect x="340" y="95" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="112" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">commerce-events</text>
  <text x="600" y="127" text-anchor="middle" fill="#fecaca" font-size="9">Order created/confirmed/shipped/completed, Cart updates</text>

  <rect x="340" y="145" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="162" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">user-behavior</text>
  <text x="600" y="177" text-anchor="middle" fill="#fecaca" font-size="9">Product views, clicks, cart abandonments, search queries</text>

  <rect x="340" y="195" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="212" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">product-events</text>
  <text x="600" y="227" text-anchor="middle" fill="#fecaca" font-size="9">Price changes, stock updates, new listings</text>

  <rect x="340" y="245" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="262" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">buy_request.created</text>
  <text x="600" y="277" text-anchor="middle" fill="#fecaca" font-size="9">New buy requests from users with budget/brand/quality prefs</text>

  <rect x="340" y="295" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="312" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">intent.processed</text>
  <text x="600" y="327" text-anchor="middle" fill="#fecaca" font-size="9">Parsed intent: categories, keywords, brands, budget clarity</text>

  <rect x="340" y="345" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="362" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">products.fetched</text>
  <text x="600" y="377" text-anchor="middle" fill="#fecaca" font-size="9">Aggregated products from Internal + Amazon + Flipkart</text>

  <rect x="340" y="395" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="412" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">products.ranked</text>
  <text x="600" y="427" text-anchor="middle" fill="#fecaca" font-size="9">ML-scored products with per-factor breakdown (0-1 scores)</text>

  <rect x="340" y="445" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="462" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">autopilot.triggered / autopilot.executed</text>
  <text x="600" y="477" text-anchor="middle" fill="#fecaca" font-size="9">Rule triggers and autonomous purchase execution results</text>

  <rect x="340" y="495" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="512" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">ml-events / recommendations</text>
  <text x="600" y="527" text-anchor="middle" fill="#fecaca" font-size="9">Generated recommendations, insights, model outputs</text>

  <rect x="340" y="545" width="520" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="600" y="562" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold">analytics</text>
  <text x="600" y="577" text-anchor="middle" fill="#fecaca" font-size="9">Business metrics, conversion rates, revenue tracking</text>

  <!-- CONSUMERS (Right) -->
  <text x="1080" y="80" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">CONSUMERS</text>

  <rect x="920" y="95" width="220" height="70" rx="8" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1030" y="118" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">AI Service (FastAPI)</text>
  <text x="1030" y="136" text-anchor="middle" fill="#a7f3d0" font-size="9">Consumes: commerce-events,</text>
  <text x="1030" y="150" text-anchor="middle" fill="#a7f3d0" font-size="9">user-behavior, product-events</text>

  <rect x="920" y="180" width="220" height="70" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1030" y="203" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Intent Parser</text>
  <text x="1030" y="221" text-anchor="middle" fill="#ddd6fe" font-size="9">Consumes: buy_request.created</text>
  <text x="1030" y="235" text-anchor="middle" fill="#ddd6fe" font-size="9">Produces: intent.processed</text>

  <rect x="920" y="265" width="220" height="70" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1030" y="288" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Product Aggregator</text>
  <text x="1030" y="306" text-anchor="middle" fill="#ddd6fe" font-size="9">Consumes: intent.processed</text>
  <text x="1030" y="320" text-anchor="middle" fill="#ddd6fe" font-size="9">Produces: products.fetched</text>

  <rect x="920" y="350" width="220" height="70" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1030" y="373" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="bold">Ranking Engine</text>
  <text x="1030" y="391" text-anchor="middle" fill="#fde68a" font-size="9">Consumes: products.fetched</text>
  <text x="1030" y="405" text-anchor="middle" fill="#fde68a" font-size="9">Produces: products.ranked</text>

  <rect x="920" y="435" width="220" height="70" rx="8" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="1030" y="458" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">Autopilot Engine</text>
  <text x="1030" y="476" text-anchor="middle" fill="#a7f3d0" font-size="9">Consumes: products.ranked</text>
  <text x="1030" y="490" text-anchor="middle" fill="#a7f3d0" font-size="9">Produces: autopilot.executed</text>

  <rect x="920" y="520" width="220" height="70" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1030" y="543" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">WebSocket Bridge</text>
  <text x="1030" y="561" text-anchor="middle" fill="#bfdbfe" font-size="9">Consumes: recommendations,</text>
  <text x="1030" y="575" text-anchor="middle" fill="#bfdbfe" font-size="9">autopilot.executed → Push to UI</text>

  <!-- Connecting arrows (Producer → Topic → Consumer) -->
  <!-- API → commerce-events -->
  <line x1="180" y1="125" x2="340" y2="114" stroke="#60a5fa" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <!-- Web → user-behavior -->
  <line x1="180" y1="190" x2="340" y2="164" stroke="#60a5fa" stroke-width="1.2" opacity="0.6" marker-end="url(#arr)"/>
  <!-- Intent Parser → intent.processed -->
  <line x1="180" y1="255" x2="340" y2="314" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>
  <!-- Aggregator → products.fetched -->
  <line x1="180" y1="320" x2="340" y2="364" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>
  <!-- Ranking → products.ranked -->
  <line x1="180" y1="385" x2="340" y2="414" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>
  <!-- Autopilot → autopilot topics -->
  <line x1="180" y1="450" x2="340" y2="464" stroke="#34d399" stroke-width="1.2" opacity="0.6"/>
  <!-- AI Service → ml-events -->
  <line x1="180" y1="515" x2="340" y2="514" stroke="#a78bfa" stroke-width="1.2" opacity="0.6"/>

  <!-- Topic → Consumer arrows -->
  <line x1="860" y1="114" x2="920" y2="130" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>
  <line x1="860" y1="264" x2="920" y2="215" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>
  <line x1="860" y1="314" x2="920" y2="300" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>
  <line x1="860" y1="364" x2="920" y2="385" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>
  <line x1="860" y1="414" x2="920" y2="470" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>
  <line x1="860" y1="514" x2="920" y2="555" stroke="#34d399" stroke-width="1.2" opacity="0.6" marker-end="url(#arrG)"/>

  <!-- Key Metrics Box -->
  <rect x="40" y="610" width="1120" height="125" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="638" fill="#e2e8f0" font-size="14" font-weight="bold">Kafka Architecture Highlights</text>

  <text x="80" y="660" fill="#94a3b8" font-size="11">• <tspan fill="#fca5a5" font-weight="bold">10+ Topics</tspan> with 3 partitions each for parallel processing</text>
  <text x="80" y="680" fill="#94a3b8" font-size="11">• <tspan fill="#6ee7b7" font-weight="bold">Consumer Groups</tspan> enable independent scaling of each microservice</text>
  <text x="80" y="700" fill="#94a3b8" font-size="11">• <tspan fill="#93c5fd" font-weight="bold">Durable Event Log</tspan> allows event replay, audit trail, and debugging</text>
  <text x="80" y="720" fill="#94a3b8" font-size="11">• <tspan fill="#c4b5fd" font-weight="bold">Choreography Pattern</tspan> — services react to events without central orchestrator (loose coupling)</text>
</svg>
