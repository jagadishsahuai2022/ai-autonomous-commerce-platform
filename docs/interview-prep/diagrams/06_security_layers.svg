<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1100" height="650" fill="url(#bg6)" rx="12"/>
  <text x="550" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Security Architecture — Defense in Depth</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">9-Layer Security Stack | OWASP Compliant | RBAC | Fraud Detection</text>

  <!-- Layer boxes - stacked -->
  <rect x="80" y="80" width="940" height="48" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="110" y="100" fill="#f87171" font-size="12" font-weight="bold">Layer 1</text>
  <text x="200" y="100" fill="#fca5a5" font-size="12" font-weight="bold">RATE LIMITING</text>
  <text x="200" y="118" fill="#fecaca" font-size="10">Token bucket algorithm per IP — configurable requests/second — Redis-backed counters</text>

  <rect x="80" y="138" width="940" height="48" rx="8" fill="#422006" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="158" fill="#fbbf24" font-size="12" font-weight="bold">Layer 2</text>
  <text x="200" y="158" fill="#fcd34d" font-size="12" font-weight="bold">CORS POLICY</text>
  <text x="200" y="176" fill="#fde68a" font-size="10">Explicit origin whitelist — no wildcard — credentials required</text>

  <rect x="80" y="196" width="940" height="48" rx="8" fill="#1a2e05" stroke="#84cc16" stroke-width="1.5"/>
  <text x="110" y="216" fill="#a3e635" font-size="12" font-weight="bold">Layer 3</text>
  <text x="200" y="216" fill="#bef264" font-size="12" font-weight="bold">CSRF PROTECTION</text>
  <text x="200" y="234" fill="#d9f99d" font-size="10">CSRF token verification guard — X-Content-Type-Options: nosniff — X-Frame-Options: DENY</text>

  <rect x="80" y="254" width="940" height="48" rx="8" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="274" fill="#34d399" font-size="12" font-weight="bold">Layer 4</text>
  <text x="200" y="274" fill="#6ee7b7" font-size="12" font-weight="bold">REQUEST TIMEOUT</text>
  <text x="200" y="292" fill="#a7f3d0" font-size="10">30-second default — TimeoutMiddleware — prevents hung connections and resource exhaustion</text>

  <rect x="80" y="312" width="940" height="48" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="332" fill="#60a5fa" font-size="12" font-weight="bold">Layer 5</text>
  <text x="200" y="332" fill="#93c5fd" font-size="12" font-weight="bold">JWT AUTHENTICATION</text>
  <text x="200" y="350" fill="#bfdbfe" font-size="10">HS256 signature validation — payload: { userId, email, role } — configurable expiry</text>

  <rect x="80" y="370" width="940" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="390" fill="#818cf8" font-size="12" font-weight="bold">Layer 6</text>
  <text x="200" y="390" fill="#a5b4fc" font-size="12" font-weight="bold">RBAC AUTHORIZATION</text>
  <text x="200" y="408" fill="#c7d2fe" font-size="10">7-role hierarchy — route-level guards — subscription tier checks (BASIC, AI_PLUS)</text>

  <rect x="80" y="428" width="940" height="48" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="110" y="448" fill="#a78bfa" font-size="12" font-weight="bold">Layer 7</text>
  <text x="200" y="448" fill="#c4b5fd" font-size="12" font-weight="bold">INPUT VALIDATION</text>
  <text x="200" y="466" fill="#ddd6fe" font-size="10">class-validator decorators — class-transformer — DTO validation with whitelist</text>

  <rect x="80" y="486" width="940" height="48" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <text x="110" y="506" fill="#4ade80" font-size="12" font-weight="bold">Layer 8</text>
  <text x="200" y="506" fill="#4ade80" font-size="12" font-weight="bold">SQL INJECTION PREVENTION</text>
  <text x="200" y="524" fill="#86efac" font-size="10">Prisma ORM parameterized queries — no raw SQL — type-safe query builder</text>

  <rect x="80" y="544" width="940" height="48" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="110" y="564" fill="#4ade80" font-size="12" font-weight="bold">Layer 9</text>
  <text x="200" y="564" fill="#4ade80" font-size="12" font-weight="bold">XSS PREVENTION</text>
  <text x="200" y="582" fill="#86efac" font-size="10">Content-Security-Policy headers — X-XSS-Protection: 1; mode=block — output encoding</text>

  <!-- Additional Security Features -->
  <rect x="80" y="605" width="940" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="550" y="627" text-anchor="middle" fill="#94a3b8" font-size="11">
    <tspan fill="#f87171" font-weight="bold">Password Security:</tspan> Bcrypt (10 rounds) |
    <tspan fill="#fbbf24" font-weight="bold">Idempotency:</tspan> Redis-backed keys (24h TTL) |
    <tspan fill="#60a5fa" font-weight="bold">Audit:</tspan> Full wallet+decision logs |
    <tspan fill="#a78bfa" font-weight="bold">AI Safety:</tspan> Guardrail engine
  </text>
</svg>
