<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="720" fill="url(#bg7)" rx="12"/>
  <text x="550" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Database Schema — Entity Relationship Overview</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">PostgreSQL 16 + Prisma 7.5 ORM | 30+ Models | Financial Audit Trail</text>

  <!-- User (Center) -->
  <rect x="410" y="80" width="280" height="95" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="102" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">User</text>
  <text x="435" y="120" fill="#bfdbfe" font-size="9">id: Int (PK) | email: String (UNIQUE)</text>
  <text x="435" y="135" fill="#bfdbfe" font-size="9">name | passwordHash (bcrypt) | role</text>
  <text x="435" y="150" fill="#bfdbfe" font-size="9">subscriptionPlan: BASIC | AI_PLUS</text>
  <text x="435" y="165" fill="#94a3b8" font-size="8">→ orders, carts, wallet, preferences, memory</text>

  <!-- Product -->
  <rect x="40" y="80" width="240" height="75" rx="10" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="102" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">Product</text>
  <text x="60" y="118" fill="#a7f3d0" font-size="9">id | name | price | category</text>
  <text x="60" y="133" fill="#a7f3d0" font-size="9">description | imageUrl | featured</text>
  <text x="60" y="148" fill="#94a3b8" font-size="8">→ cartItems, orderItems, metrics</text>

  <!-- ProductBusinessMetrics -->
  <rect x="40" y="170" width="240" height="65" rx="8" fill="#14332a" stroke="#059669" stroke-width="1"/>
  <text x="160" y="190" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="bold">ProductBusinessMetrics</text>
  <text x="60" y="206" fill="#a7f3d0" font-size="9">margin | inventory | salesVelocity</text>
  <text x="60" y="220" fill="#a7f3d0" font-size="9">conversionRate | returnRate</text>

  <!-- Order -->
  <rect x="790" y="80" width="260" height="85" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="920" y="102" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">Order</text>
  <text x="810" y="118" fill="#fde68a" font-size="9">id | userId (FK) | total | status</text>
  <text x="810" y="133" fill="#fde68a" font-size="9">pending|confirmed|shipped|delivered</text>
  <text x="810" y="148" fill="#94a3b8" font-size="8">→ orderItems, tracking</text>

  <!-- Cart -->
  <rect x="790" y="185" width="260" height="55" rx="8" fill="#451a03" stroke="#d97706" stroke-width="1"/>
  <text x="920" y="205" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">Cart / CartItem</text>
  <text x="810" y="225" fill="#fde68a" font-size="9">userId | productId | quantity</text>

  <!-- Lines from User -->
  <line x1="410" y1="130" x2="280" y2="117" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="690" y1="120" x2="790" y2="110" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="690" y1="140" x2="790" y2="210" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>

  <!-- Wallet System -->
  <rect x="40" y="270" width="300" height="140" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
  <text x="190" y="292" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">Wallet System</text>

  <rect x="55" y="302" width="270" height="25" rx="4" fill="#1e1b4b"/>
  <text x="190" y="319" text-anchor="middle" fill="#ddd6fe" font-size="10">Wallet: balance, maxPerOrder, dailyLimit, isAiAuth</text>

  <rect x="55" y="332" width="270" height="25" rx="4" fill="#1e1b4b"/>
  <text x="190" y="349" text-anchor="middle" fill="#ddd6fe" font-size="10">WalletTransaction: type, amount, before/after</text>

  <rect x="55" y="362" width="270" height="20" rx="4" fill="#1e1b4b"/>
  <text x="190" y="376" text-anchor="middle" fill="#ddd6fe" font-size="9">WalletSpendingLimit | WalletAuditLog</text>

  <rect x="55" y="386" width="270" height="18" rx="4" fill="#1e1b4b"/>
  <text x="190" y="399" text-anchor="middle" fill="#ddd6fe" font-size="9">WalletAuthorization: AI spend approval</text>

  <line x1="410" y1="170" x2="340" y2="290" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4"/>

  <!-- Autopilot System -->
  <rect x="420" y="270" width="280" height="140" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="292" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">Autopilot System</text>

  <rect x="435" y="302" width="250" height="25" rx="4" fill="#052e16"/>
  <text x="560" y="319" text-anchor="middle" fill="#86efac" font-size="10">AutopilotRule: conditions, action, limits</text>

  <rect x="435" y="332" width="250" height="25" rx="4" fill="#052e16"/>
  <text x="560" y="349" text-anchor="middle" fill="#86efac" font-size="10">AutopilotDecision: confidence, risk, reasoning</text>

  <rect x="435" y="362" width="250" height="20" rx="4" fill="#052e16"/>
  <text x="560" y="376" text-anchor="middle" fill="#86efac" font-size="9">ApprovalRequest: status, expires, reason</text>

  <rect x="435" y="386" width="250" height="18" rx="4" fill="#052e16"/>
  <text x="560" y="399" text-anchor="middle" fill="#86efac" font-size="9">status: pending|approved|rejected|expired</text>

  <line x1="550" y1="175" x2="560" y2="270" stroke="#22c55e" stroke-width="1" stroke-dasharray="4"/>

  <!-- AI Memory System -->
  <rect x="780" y="270" width="280" height="140" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="920" y="292" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="bold">AI Memory System</text>

  <rect x="795" y="302" width="250" height="25" rx="4" fill="#3f0d0d"/>
  <text x="920" y="319" text-anchor="middle" fill="#fecaca" font-size="10">UserMemory: behavior + preferences</text>

  <rect x="795" y="332" width="250" height="25" rx="4" fill="#3f0d0d"/>
  <text x="920" y="349" text-anchor="middle" fill="#fecaca" font-size="10">MemoryInsight: generated insights</text>

  <rect x="795" y="362" width="250" height="20" rx="4" fill="#3f0d0d"/>
  <text x="920" y="376" text-anchor="middle" fill="#fecaca" font-size="9">UserPreferences: categories, brands, prices</text>

  <rect x="795" y="386" width="250" height="18" rx="4" fill="#3f0d0d"/>
  <text x="920" y="399" text-anchor="middle" fill="#fecaca" font-size="9">BuyingPattern | RankingPersonalization</text>

  <line x1="690" y1="160" x2="920" y2="270" stroke="#ef4444" stroke-width="1" stroke-dasharray="4"/>

  <!-- Buy Request & Chat -->
  <rect x="40" y="440" width="320" height="75" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="462" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">BuyRequest</text>
  <text x="60" y="480" fill="#bfdbfe" font-size="9">description | budget | quality | preferredBrands</text>
  <text x="60" y="495" fill="#bfdbfe" font-size="9">delivery | autoExecute | status | matchedProducts</text>

  <rect x="40" y="530" width="320" height="55" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
  <text x="200" y="552" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">ChatMessage</text>
  <text x="60" y="570" fill="#bfdbfe" font-size="9">userId | role (user|assistant) | content | intent | keywords</text>

  <!-- Feature Flags -->
  <rect x="420" y="440" width="280" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="560" y="462" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="bold">FeatureFlag</text>
  <text x="440" y="480" fill="#c7d2fe" font-size="9">name (UNIQUE) | isEnabled | rolloutPct | targetUserIds</text>

  <!-- Seller System -->
  <rect x="780" y="440" width="280" height="120" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="920" y="462" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">Seller System</text>
  <rect x="795" y="472" width="250" height="20" rx="4" fill="#361c00"/>
  <text x="920" y="487" text-anchor="middle" fill="#fde68a" font-size="9">Seller: store info, metrics, AI config</text>
  <rect x="795" y="497" width="250" height="20" rx="4" fill="#361c00"/>
  <text x="920" y="512" text-anchor="middle" fill="#fde68a" font-size="9">SellerProduct: listings + performance</text>
  <rect x="795" y="522" width="250" height="18" rx="4" fill="#361c00"/>
  <text x="920" y="536" text-anchor="middle" fill="#fde68a" font-size="9">ListingTemplate | PriceHistory | DemandMetrics</text>

  <!-- Stats -->
  <rect x="40" y="620" width="1020" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="648" fill="#e2e8f0" font-size="13" font-weight="bold">Schema Stats &amp; Design Principles</text>
  <text x="80" y="668" fill="#94a3b8" font-size="11">
    <tspan fill="#93c5fd" font-weight="bold">30+ Prisma Models</tspan> |
    <tspan fill="#6ee7b7" font-weight="bold">Full Financial Audit Trail</tspan> |
    <tspan fill="#fcd34d" font-weight="bold">JSON fields for flexible data</tspan> |
    <tspan fill="#c4b5fd" font-weight="bold">Soft delete patterns</tspan>
  </text>
  <text x="80" y="690" fill="#94a3b8" font-size="11">
    <tspan fill="#fca5a5" font-weight="bold">Balance snapshots per transaction</tspan> |
    <tspan fill="#4ade80" font-weight="bold">Enum-based status machines</tspan> |
    <tspan fill="#60a5fa" font-weight="bold">Indexed for performance</tspan>
  </text>
</svg>
