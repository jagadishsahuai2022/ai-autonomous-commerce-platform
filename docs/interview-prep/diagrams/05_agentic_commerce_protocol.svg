<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bg5)" rx="12"/>
  <text x="550" y="38" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Agentic Commerce Protocol (ACP) — Merchant Adapter Architecture</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Standardized Protocol for AI Agents to Interact with Multiple Merchants</text>

  <!-- AI Agent -->
  <rect x="420" y="80" width="260" height="65" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="105" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="bold">AI Shopping Agent</text>
  <text x="550" y="125" text-anchor="middle" fill="#ddd6fe" font-size="10">Natural language → Structured request</text>

  <!-- ACP Gateway -->
  <rect x="300" y="180" width="500" height="80" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="205" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="bold">ACP Gateway Service</text>
  <text x="550" y="225" text-anchor="middle" fill="#bfdbfe" font-size="11">Unified API: /search → /quote → /checkout → /status</text>
  <text x="550" y="242" text-anchor="middle" fill="#bfdbfe" font-size="10">Payment Tokenization | Verification Layer | Correlation Tracking</text>

  <line x1="550" y1="145" x2="550" y2="180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#a5)"/>

  <!-- Verification Layer -->
  <rect x="60" y="180" width="210" height="80" rx="8" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="165" y="205" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">Verification Layer</text>
  <text x="165" y="222" text-anchor="middle" fill="#a7f3d0" font-size="9">✓ Budget verification</text>
  <text x="165" y="236" text-anchor="middle" fill="#a7f3d0" font-size="9">✓ Availability check</text>
  <text x="165" y="250" text-anchor="middle" fill="#a7f3d0" font-size="9">✓ Trust score validation</text>

  <line x1="270" y1="220" x2="300" y2="220" stroke="#10b981" stroke-width="1.5"/>

  <!-- Payment Token Service -->
  <rect x="830" y="180" width="210" height="80" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="935" y="205" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="bold">Payment Token Service</text>
  <text x="935" y="222" text-anchor="middle" fill="#fde68a" font-size="9">Tokenized payments</text>
  <text x="935" y="236" text-anchor="middle" fill="#fde68a" font-size="9">Wallet hold/debit</text>
  <text x="935" y="250" text-anchor="middle" fill="#fde68a" font-size="9">Razorpay integration</text>

  <line x1="800" y1="220" x2="830" y2="220" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Adapter Layer -->
  <text x="550" y="295" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Merchant Adapter Layer (Plugin Architecture)</text>

  <line x1="550" y1="260" x2="550" y2="310" stroke="#3b82f6" stroke-width="2"/>

  <!-- Three branching lines -->
  <line x1="550" y1="310" x2="165" y2="340" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="550" y1="310" x2="550" y2="340" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="550" y1="310" x2="935" y2="340" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Amazon Adapter -->
  <rect x="40" y="345" width="250" height="110" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="370" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">AmazonMerchantAdapter</text>
  <rect x="55" y="380" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="165" y="396" text-anchor="middle" fill="#bfdbfe" font-size="10">search(query) → Product[]</text>
  <rect x="55" y="406" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="165" y="422" text-anchor="middle" fill="#bfdbfe" font-size="10">getQuote(productId) → Quote</text>
  <rect x="55" y="432" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="165" y="448" text-anchor="middle" fill="#bfdbfe" font-size="10">checkout(order) → OrderResult</text>

  <!-- Internal Adapter -->
  <rect x="425" y="345" width="250" height="110" rx="10" fill="#14332a" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="370" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">InternalSellerAdapter</text>
  <rect x="440" y="380" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="550" y="396" text-anchor="middle" fill="#a7f3d0" font-size="10">search(query) → Product[]</text>
  <rect x="440" y="406" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="550" y="422" text-anchor="middle" fill="#a7f3d0" font-size="10">getQuote(productId) → Quote</text>
  <rect x="440" y="432" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="550" y="448" text-anchor="middle" fill="#a7f3d0" font-size="10">checkout(order) → OrderResult</text>

  <!-- Flipkart Adapter -->
  <rect x="810" y="345" width="250" height="110" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="935" y="370" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">FlipkartMerchantAdapter</text>
  <rect x="825" y="380" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="935" y="396" text-anchor="middle" fill="#fde68a" font-size="10">search(query) → Product[]</text>
  <rect x="825" y="406" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="935" y="422" text-anchor="middle" fill="#fde68a" font-size="10">getQuote(productId) → Quote</text>
  <rect x="825" y="432" width="220" height="22" rx="4" fill="#0f172a"/>
  <text x="935" y="448" text-anchor="middle" fill="#fde68a" font-size="10">checkout(order) → OrderResult</text>

  <!-- Request Flow -->
  <text x="550" y="495" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">ACP Request Lifecycle</text>

  <!-- Step boxes -->
  <rect x="40" y="515" width="170" height="55" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="538" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">1. SEARCH</text>
  <text x="125" y="555" text-anchor="middle" fill="#bfdbfe" font-size="9">Multi-merchant parallel</text>

  <line x1="210" y1="542" x2="250" y2="542" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="255" y="515" width="170" height="55" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="538" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">2. QUOTE</text>
  <text x="340" y="555" text-anchor="middle" fill="#bfdbfe" font-size="9">Price + availability lock</text>

  <line x1="425" y1="542" x2="465" y2="542" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="470" y="515" width="170" height="55" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="555" y="538" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">3. VERIFY</text>
  <text x="555" y="555" text-anchor="middle" fill="#bfdbfe" font-size="9">Budget + trust + fraud</text>

  <line x1="640" y1="542" x2="680" y2="542" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="685" y="515" width="170" height="55" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="770" y="538" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">4. CHECKOUT</text>
  <text x="770" y="555" text-anchor="middle" fill="#86efac" font-size="9">Execute + payment token</text>

  <line x1="855" y1="542" x2="895" y2="542" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="900" y="515" width="170" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="985" y="538" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">5. STATUS</text>
  <text x="985" y="555" text-anchor="middle" fill="#c7d2fe" font-size="9">Track via correlationId</text>

  <!-- Design Patterns -->
  <rect x="40" y="600" width="1020" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="625" fill="#e2e8f0" font-size="13" font-weight="bold">Design Patterns in ACP</text>

  <text x="80" y="648" fill="#93c5fd" font-size="11">• <tspan font-weight="bold">Adapter Pattern</tspan> — Unified interface for heterogeneous merchant APIs</text>
  <text x="80" y="665" fill="#6ee7b7" font-size="11">• <tspan font-weight="bold">Circuit Breaker</tspan> — Graceful degradation when merchant APIs are down</text>
  <text x="600" y="648" fill="#fcd34d" font-size="11">• <tspan font-weight="bold">Token Pattern</tspan> — Tokenized payments for security</text>
  <text x="600" y="665" fill="#c4b5fd" font-size="11">• <tspan font-weight="bold">Correlation ID</tspan> — End-to-end request tracing</text>
</svg>
