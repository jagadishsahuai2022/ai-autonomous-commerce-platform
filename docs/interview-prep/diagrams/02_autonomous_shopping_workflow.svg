<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="850" fill="url(#bg2)" rx="12"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="bold">Autonomous Shopping — End-to-End Workflow</text>
  <text x="600" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">Buy Request → Intent Parsing → Product Aggregation → ML Ranking → Decision Engine → HITL → Checkout</text>

  <!-- STEP 1: User Buy Request -->
  <rect x="40" y="90" width="200" height="90" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2" filter="url(#glow)"/>
  <text x="140" y="115" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">1. User Creates</text>
  <text x="140" y="133" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">Buy Request</text>
  <text x="140" y="155" text-anchor="middle" fill="#cbd5e1" font-size="10">"Samsung phone under 30K"</text>
  <text x="140" y="170" text-anchor="middle" fill="#cbd5e1" font-size="10">budget, brand, quality</text>

  <!-- Arrow 1→2 -->
  <line x1="240" y1="135" x2="290" y2="135" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="265" y="125" text-anchor="middle" fill="#94a3b8" font-size="9">Kafka</text>

  <!-- STEP 2: Intent Parser -->
  <rect x="295" y="90" width="200" height="90" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
  <text x="395" y="112" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="bold">2. Intent Parser</text>
  <text x="395" y="132" text-anchor="middle" fill="#ddd6fe" font-size="10">NLP + LLM (GPT-4)</text>
  <text x="395" y="148" text-anchor="middle" fill="#ddd6fe" font-size="10">→ Category: smartphones</text>
  <text x="395" y="163" text-anchor="middle" fill="#ddd6fe" font-size="10">→ Brand: Samsung, Budget: 30K</text>

  <!-- Arrow 2→3 -->
  <line x1="495" y1="135" x2="545" y2="135" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="520" y="125" text-anchor="middle" fill="#94a3b8" font-size="9">Kafka</text>

  <!-- STEP 3: Product Aggregator -->
  <rect x="550" y="90" width="200" height="90" rx="10" fill="#1a2e05" stroke="#84cc16" stroke-width="2"/>
  <text x="650" y="112" text-anchor="middle" fill="#bef264" font-size="13" font-weight="bold">3. Product Aggregator</text>
  <text x="650" y="132" text-anchor="middle" fill="#d9f99d" font-size="10">Multi-Source Search:</text>
  <text x="650" y="148" text-anchor="middle" fill="#d9f99d" font-size="10">Internal + Amazon</text>
  <text x="650" y="163" text-anchor="middle" fill="#d9f99d" font-size="10">+ Flipkart → Redis Cache</text>

  <!-- Arrow 3→4 -->
  <line x1="750" y1="135" x2="800" y2="135" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="775" y="125" text-anchor="middle" fill="#94a3b8" font-size="9">Kafka</text>

  <!-- STEP 4: Ranking Engine -->
  <rect x="805" y="90" width="200" height="90" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="905" y="112" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="bold">4. Ranking Engine</text>
  <text x="905" y="132" text-anchor="middle" fill="#fde68a" font-size="10">ML Weighted Scoring:</text>
  <text x="905" y="148" text-anchor="middle" fill="#fde68a" font-size="10">Budget(25%) + Quality(25%)</text>
  <text x="905" y="163" text-anchor="middle" fill="#fde68a" font-size="10">Brand(20%) + Delivery(15%)</text>

  <!-- Arrow 4→5 -->
  <path d="M 905 180 L 905 210 L 600 210 L 600 250" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="205" text-anchor="middle" fill="#94a3b8" font-size="9">Kafka: products.ranked</text>

  <!-- STEP 5: Autopilot Rule Engine -->
  <rect x="440" y="255" width="320" height="100" rx="10" fill="#14332a" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="278" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">5. Autopilot Rule Engine</text>
  <text x="600" y="298" text-anchor="middle" fill="#a7f3d0" font-size="11">Evaluate user rules against ranked products:</text>
  <text x="600" y="315" text-anchor="middle" fill="#a7f3d0" font-size="10">✓ price ≤ 30000  ✓ brand = Samsung  ✓ rating ≥ 4.0</text>
  <text x="600" y="332" text-anchor="middle" fill="#a7f3d0" font-size="10">✓ stock > 0  ✓ within daily spend limit</text>

  <!-- Arrow 5→6 -->
  <line x1="600" y1="355" x2="600" y2="400" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 6: Decision Engine -->
  <rect x="380" y="405" width="440" height="100" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="428" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">6. Decision Engine — Confidence Scoring</text>
  <text x="600" y="448" text-anchor="middle" fill="#c7d2fe" font-size="11">Multi-Factor Analysis: Rule Match + History + Price Stability + Risk</text>

  <!-- Confidence indicators -->
  <rect x="400" y="460" width="130" height="35" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="465" y="478" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">≥80% → AUTO</text>
  <text x="465" y="491" text-anchor="middle" fill="#86efac" font-size="9">Low Risk</text>

  <rect x="540" y="460" width="130" height="35" rx="6" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
  <text x="605" y="478" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">50-79% → HITL</text>
  <text x="605" y="491" text-anchor="middle" fill="#fde68a" font-size="9">Medium Risk</text>

  <rect x="680" y="460" width="130" height="35" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="745" y="478" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">&lt;50% → BLOCK</text>
  <text x="745" y="491" text-anchor="middle" fill="#fca5a5" font-size="9">High Risk</text>

  <!-- Branch: AUTO EXECUTE (left) -->
  <path d="M 465 505 L 465 530 L 180 530 L 180 570" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="320" y="525" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">Confidence ≥ 80%</text>

  <!-- STEP 7A: Safety Layer -->
  <rect x="60" y="575" width="240" height="80" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="598" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">7A. Safety Layer</text>
  <text x="180" y="618" text-anchor="middle" fill="#86efac" font-size="10">✓ Wallet balance check</text>
  <text x="180" y="633" text-anchor="middle" fill="#86efac" font-size="10">✓ Spend limit validation</text>
  <text x="180" y="648" text-anchor="middle" fill="#86efac" font-size="10">✓ Fraud risk assessment</text>

  <!-- Arrow to checkout -->
  <line x1="180" y1="655" x2="180" y2="700" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Auto Checkout -->
  <rect x="80" y="705" width="200" height="60" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="732" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="bold">AUTO CHECKOUT</text>
  <text x="180" y="750" text-anchor="middle" fill="#86efac" font-size="10">Execute purchase via ACP</text>

  <!-- Branch: HITL (center) -->
  <path d="M 605 505 L 605 530 L 600 530 L 600 570" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="555" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">50-79% Confidence</text>

  <!-- STEP 7B: HITL Approval -->
  <rect x="440" y="575" width="320" height="80" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="598" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">7B. HITL Approval Request</text>
  <text x="600" y="618" text-anchor="middle" fill="#fde68a" font-size="10">→ Notify user (email/push/in-app)</text>
  <text x="600" y="633" text-anchor="middle" fill="#fde68a" font-size="10">→ Show AI reasoning &amp; product details</text>
  <text x="600" y="648" text-anchor="middle" fill="#fde68a" font-size="10">→ 24-hour TTL for response</text>

  <!-- HITL branches -->
  <path d="M 520 655 L 520 700 L 420 700 L 420 725" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="690" text-anchor="middle" fill="#4ade80" font-size="10">Approved</text>

  <path d="M 680 655 L 680 700 L 780 700 L 780 725" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="730" y="690" text-anchor="middle" fill="#f87171" font-size="10">Rejected / Expired</text>

  <rect x="340" y="730" width="160" height="45" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="420" y="752" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">CHECKOUT</text>
  <text x="420" y="767" text-anchor="middle" fill="#86efac" font-size="9">Execute via ACP</text>

  <rect x="700" y="730" width="160" height="45" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="780" y="752" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">CANCELLED</text>
  <text x="780" y="767" text-anchor="middle" fill="#fca5a5" font-size="9">Record feedback</text>

  <!-- Branch: BLOCK (right) -->
  <path d="M 745 505 L 745 530 L 1020 530 L 1020 570" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="880" y="525" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">Confidence &lt; 50%</text>

  <!-- STEP 7C: Blocked -->
  <rect x="900" y="575" width="240" height="80" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="1020" y="598" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">7C. BLOCKED</text>
  <text x="1020" y="618" text-anchor="middle" fill="#fca5a5" font-size="10">High risk / Low confidence</text>
  <text x="1020" y="633" text-anchor="middle" fill="#fca5a5" font-size="10">Decision stored with reasoning</text>
  <text x="1020" y="648" text-anchor="middle" fill="#fca5a5" font-size="10">User notified for manual review</text>

  <!-- Step 8: Order + Notification -->
  <rect x="200" y="790" width="800" height="48" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="812" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="bold">8. Order Created → Kafka Event → WebSocket Notification → Real-time UI Update</text>
  <text x="600" y="828" text-anchor="middle" fill="#bfdbfe" font-size="10">Explainability Layer: Full decision reasoning stored &amp; displayed to user</text>

  <!-- Arrows to final -->
  <line x1="180" y1="765" x2="400" y2="790" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <line x1="420" y1="775" x2="500" y2="790" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
</svg>
