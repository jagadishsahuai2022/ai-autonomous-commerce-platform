# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse-proxy config for DelegateCart on Hostinger VPS
#
# ARCHITECTURE (why all traffic goes to web container):
#   Browser → Nginx → web container (port 3000, Next.js)
#                         │
#                         ├─ /api/auth/*    → Next.js route handlers (auth/session/me)
#                         ├─ /api/user/*    → Next.js route handlers (profile/addresses)
#                         ├─ /api/v1/*      → Next.js rewrite → http://api:3001 (NestJS)
#                         └─ /api/*         → Next.js route handlers (products/cart/etc)
#
#   NestJS (port 3001) is NEVER called directly from the browser.
#   It is called server-side by the Next.js container via Docker internal network.
#
# SETUP ON VPS:
#   1. Copy this file:
#        cp /root/delegatecart/infra/nginx/delegatecart.conf \
#           /etc/nginx/sites-available/delegatecart.conf
#   2. Replace delegatecart.com with your domain (e.g. delegatecart.com):
#        sed -i 's/delegatecart.com/delegatecart.com/g' \
#           /etc/nginx/sites-available/delegatecart.conf
#   3. Enable the site:
#        ln -sf /etc/nginx/sites-available/delegatecart.conf \
#                /etc/nginx/sites-enabled/delegatecart.conf
#        rm -f /etc/nginx/sites-enabled/default
#   4. Get SSL certificate (if not already done):
#        certbot --nginx -d delegatecart.com -d www.delegatecart.com
#   5. Test and reload:
#        nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name delegatecart.com www.delegatecart.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name delegatecart.com www.delegatecart.com;

    # ── SSL certificates (managed by Certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/delegatecart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delegatecart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Upload limit (for product images etc.) ─────────────────────────────────
    client_max_body_size 50m;

    # ── All traffic → Next.js web container (port 3000) ───────────────────────
    # Next.js handles:
    #   • All page routes (SSR/SSG)
    #   • /api/* — Next.js API route handlers
    #   • /api/v1/* — proxied internally to NestJS via next.config.js rewrite
    #   • /uploads/* — proxied to NestJS via next.config.js rewrite (product images)
    #   • /socket.io/* — proxied to NestJS via next.config.js rewrite (WebSocket)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for WebSocket (Next.js HMR / socket.io)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Pass real client info to Next.js
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — generous for AI/LLM responses
        proxy_read_timeout    120s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    120s;
    }

    # ── Static assets — long cache ─────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
}
