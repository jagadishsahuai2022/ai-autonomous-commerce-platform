[pytest]
# Pytest configuration for Python microservices

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.9

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=html:coverage
    --cov-report=lcov:coverage/lcov.info
    --cov-report=term-missing
    --cov-report=json:coverage.json
    --cov-branch
    --cov-config=.coveragerc
    -p no:warnings

# Coverage thresholds
[coverage:run]
branch = True
source = .
omit = 
    */venv/*
    */tests/*
    */test_*.py
    conftest.py

[coverage:report]
precision = 2
skip_empty = True
sort = Cover

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    network: Tests requiring network
    llm: Tests requiring LLM service
    kafka: Tests requiring Kafka
    database: Tests requiring database

# Test timeout
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio
asyncio_mode = auto
